<!DOCTYPE html>
<html>
    <head>
        <title>Weather App  </title>
    </head>
    <body>
        <h1> weather app </h1>
        <input type="text" id="name" placeholder="enter city name">
        <button onclick="weather()">find weather</button>
        <p id="result"></p>
        <canvas id="chart"></canvas>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script>
            let chart;
            async function weather(){
            let city=document.getElementById("name").value;
            let key="63966844eed5176c8d7543e68d6be7ba"
           let url = "https://api.openweathermap.org/data/2.5/weather?q="
    + city + "&appid=" + key + "&units=metric";
            let r=await fetch(url);
            let d=await r.json();
            if(!r.ok){
                document.getElementById("result").innerHTML="city not found";
                return;
            }
            document.getElementById("result").innerHTML="temperature in "+city+" is "+d.main.temp+"°C";
            if(chart){
                chart.destroy();
            }
            chart=new Chart(document.getElementById("chart"),{
                type:"bar",
                data:{
                    labels:["temperature","feels like"],
                    datasets:[{
                        label:"tempertaure in °C",
                        data: [d.main.temp, d.main.feels_like],
                    }]
                }
            });
        }
        </script>
    </body>
</html>
